<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Space Arcade Smartphone Controller — Wireless Gamepad for Space Arcade Console">
  <title>Gamepad Controller — Space Arcade</title>
  <link rel="icon" type="image/svg+xml" href="assets/spaceship.svg">
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body {
      margin: 0;
      padding: 0;
      background: #060214;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Top Status Bar */
    .controller-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      background: rgba(18, 10, 42, 0.9);
      border-bottom: 1px solid rgba(0, 240, 255, 0.2);
    }

    .controller-brand {
      font-size: 0.9rem;
      font-weight: 800;
      color: #00f0ff;
      letter-spacing: 1px;
    }

    .connection-badge {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 12px;
      background: rgba(255, 0, 127, 0.2);
      border: 1px solid #ff007f;
      color: #ff007f;
    }

    .connection-badge.connected {
      background: rgba(0, 255, 136, 0.2);
      border-color: #00ff88;
      color: #00ff88;
    }

    /* Pair Screen Overlay (when opening manually) */
    .pair-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #070314;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }

    .pair-overlay.hidden {
      display: none;
    }

    .pair-card {
      background: rgba(18, 10, 42, 0.9);
      border: 1px solid rgba(0, 240, 255, 0.3);
      padding: 2rem;
      border-radius: 16px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
    }

    .pair-input {
      width: 100%;
      padding: 12px;
      font-size: 1.2rem;
      text-align: center;
      letter-spacing: 4px;
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(0, 240, 255, 0.4);
      color: #00f0ff;
      border-radius: 8px;
      margin: 1rem 0;
      text-transform: uppercase;
    }

    .pair-btn {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      font-weight: 800;
      background: linear-gradient(135deg, #00f0ff, #ff007f);
      border: none;
      color: #fff;
      border-radius: 8px;
      cursor: pointer;
    }

    /* Main Gamepad Interface */
    .gamepad-container {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      padding: 1rem;
      gap: 1rem;
      align-items: center;
    }

    /* Left Side: D-Pad */
    .dpad-section {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .dpad {
      width: 160px;
      height: 160px;
      position: relative;
    }

    .dpad-btn {
      position: absolute;
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid rgba(0, 240, 255, 0.4);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      color: #00f0ff;
      box-shadow: inset 0 0 10px rgba(0, 240, 255, 0.2);
      transition: background 0.1s, transform 0.1s;
    }

    .dpad-btn:active, .dpad-btn.active {
      background: rgba(0, 240, 255, 0.4);
      box-shadow: 0 0 15px #00f0ff;
      transform: scale(0.95);
    }

    .dpad-up { top: 0; left: 55px; width: 50px; height: 55px; border-radius: 10px 10px 4px 4px; }
    .dpad-down { bottom: 0; left: 55px; width: 50px; height: 55px; border-radius: 4px 4px 10px 10px; }
    .dpad-left { top: 55px; left: 0; width: 55px; height: 50px; border-radius: 10px 4px 4px 10px; }
    .dpad-right { top: 55px; right: 0; width: 55px; height: 50px; border-radius: 4px 10px 10px 4px; }
    .dpad-center { top: 55px; left: 55px; width: 50px; height: 50px; background: rgba(0,240,255,0.03); border: 1px solid rgba(0,240,255,0.2); }

    /* Right Side: Action Buttons */
    .action-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .button-cluster {
      width: 150px;
      height: 150px;
      position: relative;
    }

    .btn-action {
      position: absolute;
      width: 55px;
      height: 55px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      font-weight: 800;
      color: #fff;
      border: 2px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      transition: transform 0.1s, background 0.1s;
    }

    .btn-action:active, .btn-action.active {
      transform: scale(0.92);
    }

    .btn-a { bottom: 0; left: 47px; background: rgba(0, 255, 136, 0.2); border-color: #00ff88; color: #00ff88; }
    .btn-a:active { background: #00ff88; color: #000; box-shadow: 0 0 15px #00ff88; }

    .btn-b { top: 47px; right: 0; background: rgba(255, 0, 127, 0.2); border-color: #ff007f; color: #ff007f; }
    .btn-b:active { background: #ff007f; color: #fff; box-shadow: 0 0 15px #ff007f; }

    .btn-x { top: 47px; left: 0; background: rgba(0, 240, 255, 0.2); border-color: #00f0ff; color: #00f0ff; }
    .btn-x:active { background: #00f0ff; color: #000; box-shadow: 0 0 15px #00f0ff; }

    .btn-y { top: 0; left: 47px; background: rgba(255, 234, 0, 0.2); border-color: #ffea00; color: #ffea00; }
    .btn-y:active { background: #ffea00; color: #000; box-shadow: 0 0 15px #ffea00; }

    /* Middle System Buttons */
    .system-bar {
      display: flex;
      justify-content: center;
      gap: 20px;
      padding: 10px;
      background: rgba(0,0,0,0.3);
    }

    .sys-btn {
      padding: 8px 18px;
      border-radius: 20px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.2);
      color: #a0aec0;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .sys-btn:active {
      background: rgba(0, 240, 255, 0.2);
      color: #00f0ff;
    }
  </style>
</head>
<body>

  <!-- Pairing Overlay (if opened directly without room param) -->
  <div class="pair-overlay" id="pair-overlay">
    <div class="pair-card">
      <h2 style="color:#00f0ff; margin-top:0;">📱 Connect Gamepad</h2>
      <p style="font-size:0.85rem; color:#a0aec0;">Enter 4-character Room Code displayed on your PC screen:</p>
      <input type="text" class="pair-input" id="room-input" placeholder="ROOM" maxlength="6" autocomplete="off">
      <button class="pair-btn" id="connect-btn">CONNECT GAMEPAD ✦</button>
    </div>
  </div>

  <!-- Controller Top Status Bar -->
  <div class="controller-bar">
    <div class="controller-brand">🎮 SPACE CONTROLLER</div>
    <div class="connection-badge" id="conn-badge">CONNECTING...</div>
  </div>

  <!-- Controller Gamepad Area -->
  <div class="gamepad-container">
    
    <!-- Left: D-Pad -->
    <div class="dpad-section">
      <div class="dpad">
        <div class="dpad-btn dpad-up" data-key="ArrowUp">▲</div>
        <div class="dpad-btn dpad-left" data-key="ArrowLeft">◀</div>
        <div class="dpad-btn dpad-right" data-key="ArrowRight">▶</div>
        <div class="dpad-btn dpad-down" data-key="ArrowDown">▼</div>
        <div class="dpad-center"></div>
      </div>
    </div>

    <!-- Right: Action Buttons -->
    <div class="action-section">
      <div class="button-cluster">
        <div class="btn-action btn-y" data-key="w">Y</div>
        <div class="btn-action btn-x" data-key="c">X</div>
        <div class="btn-action btn-b" data-key="Escape">B</div>
        <div class="btn-action btn-a" data-key=" ">A</div>
      </div>
    </div>

  </div>

  <!-- Bottom System Controls -->
  <div class="system-bar">
    <div class="sys-btn" data-key="Enter" id="btn-select">SELECT</div>
    <div class="sys-btn" data-key="Escape" id="btn-menu">MENU / HUB</div>
    <div class="sys-btn" data-key=" " id="btn-start">START</div>
  </div>

  <!-- Scripts -->
  <script type="module" src="js/transitions.js"></script>
  <script type="module" src="js/controller-engine.js"></script>
</body>
</html>
